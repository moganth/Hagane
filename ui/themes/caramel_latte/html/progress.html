<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Installing</title></head><body>
<div class="root">
  <div class="banner">
    <div class="brand-tile">
      <img id="banner-logo" class="banner-logo" alt="">
      <div id="banner-logo-ph" class="banner-logo-ph"></div>
    </div>
    <div id="banner-art" class="banner-art"></div>
  </div>
  <div class="content">
    <div class="page-title" id="page-title">Cafe Brew Session</div>
    <div class="progress-header">
      <div class="progress-label" id="progress-label">Lighting lamps and warming the bench...</div>
      <div class="progress-pct" id="progress-pct">0%</div>
    </div>
    <div class="progress-grid">
      <div class="brew-panel">
        <div class="brew-scene">
          <div class="brew-label"><span>Cafe mood</span><span id="brew-stage-label">Warming the kettle</span></div>
          <div class="brew-stage" aria-hidden="true">
            <div class="steam"><span></span><span></span><span></span><span></span></div>
            <div class="cup-wrap">
              <div class="cup">
                <div class="cup-fill" id="cup-fill" style="height:0%"></div>
                <div class="cup-crumbs"><i></i><i></i><i></i></div>
              </div>
            </div>
          </div>
          <div class="brew-caption"><span id="brew-caption-left">Preparing your corner table...</span><strong id="brew-caption-right">0%</strong></div>
        </div>
        <div class="status-row"><div class="spinner" id="spinner"></div><span id="status-text">Please wait...</span></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <button id="btn-cancel" class="btn btn-ghost">Cancel</button>
    <button id="btn-next"   class="btn btn-primary">Next -&gt;</button>
  </div>
</div>
<script>__HAGANE_PROGRESS_JS__</script>
</body></html>
