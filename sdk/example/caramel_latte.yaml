# -- MyApp Installer Definition -------------------------------------------------
# Build with: iebuild --manifest caramel_latte.yaml --build
# Silent:     MyApp-setup.exe /S

app:
  name: "MyApp"
  version: "2.1.0"
  publisher: "Acme Corporation"
  description: "A fast, modern productivity application for Windows."
  website: "https://example.com"
  support_url: "https://example.com/support"
  logo: "assets/logo.png"
  banner: "assets/banner.gif"
  icon: "assets/icon.ico"
  default_install_dir: "{{INSTALL_ROOT}}"
  registry_key: "{{COMPANY_PRODUCT}}"
  require_admin: true

variables:
  COMPANY: "Acme"
  PRODUCT: "MyApp"
  COMPANY_PRODUCT: "{{COMPANY}}/{{PRODUCT}}"
  INSTALL_ROOT: "{{PROGRAMFILES64}}/{{COMPANY}}/{{PRODUCT}}"
  LOG_DIR: "{{INSTDIR}}/logs"
  APP_EXE: "{{INSTDIR}}/MyApp.exe"
  UNINSTALL_KEY: "SOFTWARE/Microsoft/Windows/CurrentVersion/Uninstall/AcmeMyApp"
  APP_REG_KEY: "SOFTWARE/{{COMPANY_PRODUCT}}"

logging:
  mode: auto
  path: "{{LOG_DIR}}"
  file_name: "installation.log"
  timestamp: true
  include_raw_os_error: false
  slow_step_warn_sec: 10

theme:
  preset: "caramel_latte"
  accent_color: "#A0522D"
  accent_dark_color: "#7A3B1E"
  accent_light_color: "#F5E6D3"
  background_color: "#FDF6EE"
  surface_color: "#F5EAD8"
  text_color: "#3B2314"
  text_muted_color: "#8B6347"
  border_color: "#D4B896"
  success_color: "#5A7A3A"
  success_bg_color: "#EFF5E8"
  error_color: "#8B2500"
  error_bg_color: "#FCF0EB"
  progress_color: "#A0522D"
  progress_light_color: "#E8C9A8"
  font_family: "'Georgia', 'Palatino Linotype', serif"
  border_radius: 12
  window_width: 780
  window_height: 540
  banner_position: top

pages:
  - type: welcome
    title: "Welcome to MyApp Setup"
    subtitle: "Version 2.1.0"

  - type: license
    title: "License Agreement"
    license_file: "docs/LICENSE.txt"

  - type: requirements
    title: "System Requirements Check"

  - type: install_dir
    title: "Choose Installation Folder"

  - type: components
    title: "Select Components"

  - type: custom
    id: deployment_identity
    title: "Deployment Identity"
    subtitle: "Capture organization and operator notes for this installation."
    widgets:
      - type: label
        id: identity_intro
        text: "Values entered on custom pages are stored as installer variables and are available to later install hooks."

      - type: text_input
        id: organization_name
        label: "Organization name"
        bind_to: ORGANIZATION_NAME
        default: "Acme"
        placeholder: "Company or team name"
        help_text: "Used for logs, support notes, and post-install messaging."
        required: true

      - type: multiline_input
        id: install_notes
        label: "Install notes"
        bind_to: INSTALL_NOTES
        default: ""
        placeholder: "Optional notes for this deployment"
        help_text: "Useful for deployment metadata or operator comments."

  - type: custom
    id: deployment_options
    title: "Deployment Options"
    subtitle: "Choose installation behavior and runtime integration options."
    widgets:
      - type: label
        id: options_intro
        text: "These options demonstrate checkbox, radio, dropdown, and folder picker widgets on a second custom page."

      - type: checkbox
        id: import_certs
        label: "Import certificates during setup"
        bind_to: IMPORT_CERTS
        default: true
        help_text: "If enabled, the installer can use the selected certificate folder during post-install tasks."

      - type: radio_group
        id: install_mode
        label: "Install mode"
        bind_to: INSTALL_MODE
        required: true
        default: standard
        help_text: "Choose the overall setup behavior."
        options:
          - label: "Standard"
            value: standard
            description: "Install the normal recommended set of features."
          - label: "Advanced"
            value: advanced
            description: "Enable advanced deployment behavior and extra logging."

      - type: dropdown
        id: update_channel
        label: "Update channel"
        bind_to: UPDATE_CHANNEL
        default: stable
        help_text: "Controls how future update checks should classify this installation."
        options:
          - label: "Stable"
            value: stable
            description: "Recommended for most users."
          - label: "Beta"
            value: beta
            description: "Receives preview releases earlier."
          - label: "Internal"
            value: internal
            description: "For internal deployment and testing only."

      - type: folder_picker
        id: cert_dir
        label: "Certificates folder"
        bind_to: CERT_DIR
        default: "{{INSTDIR}}/certs"
        browse_title: "Select certificate folder"
        help_text: "This path is exposed to install steps as {{CERT_DIR}}."
        required: true
        must_exist: false

  - type: summary
    title: "Ready to Install"

  - type: install
    title: "Installing MyApp"

  - type: finish
    title: "Setup Complete"

requirements:
  - type: os
    platform: windows
    min_build: 18362        # Windows 10 1903+
    label: "Windows 10 1903 or newer"

  - type: ram
    min_mb: 2048
    label: "2 GB RAM minimum"

  - type: disk
    min_mb: 512
    path: "{{INSTDIR}}"
    label: "512 MB free disk space"

  - type: dotnet
    min_version: "4.8"
    label: ".NET Framework 4.8"


components:
  - id: core
    name: "Core Application"
    description: "The main application files. Required."
    size_mb: 120
    required: true
    selected: true

  - id: docs
    name: "Documentation"
    description: "PDF user manual and help files."
    size_mb: 18
    required: false
    selected: true

  - id: samples
    name: "Sample Files"
    description: "Example projects and templates to get you started."
    size_mb: 34
    required: false
    selected: false

  - id: cli
    name: "Command Line Tools"
    description: "myapp.exe CLI - adds to system PATH."
    size_mb: 8
    required: false
    selected: false

install:
  setup:
    create_dirs:
      - "{{INSTDIR}}"
      - "{{LOG_DIR}}"

  components:
    core:
      archive: "payload.zst"
      target: "{{INSTDIR}}"
    docs:
      archive: "docs.zst"
      target: "{{INSTDIR}}/docs"
    samples:
      archive: "samples.zst"
      target: "{{INSTDIR}}/samples"

  system:
    register_app:
      key: "{{APP_REG_KEY}}"
      hive: HKLM
      version: "2.1.0"
      install_location: "{{INSTDIR}}"

    register_uninstall:
      key: "{{UNINSTALL_KEY}}"
      hive: HKLM
      name: "MyApp 2.1.0"
      version: "2.1.0"
      publisher: "Acme Corporation"
      install_location: "{{INSTDIR}}"
      uninstall: "{{INSTDIR}}/uninstall.exe"
      estimated_size_kb: 180224
      no_modify: true
      no_repair: true

    shortcuts:
      - name: "MyApp"
        target: "{{APP_EXE}}"
        location: desktop
        description: "Launch MyApp"
        icon: "{{APP_EXE}}"
        working_dir: "{{INSTDIR}}"
        component: core

      - name: "MyApp"
        target: "{{APP_EXE}}"
        location: start_menu
        description: "Launch MyApp"
        icon: "{{APP_EXE}}"
        working_dir: "{{INSTDIR}}"
        component: core

      - name: "MyApp User Manual"
        target: "{{INSTDIR}}/docs/UserManual.pdf"
        location: start_menu
        component: docs

    path:
      add: "{{INSTDIR}}/bin"
      scope: system

  hooks:
    post_install:
      - run:
          command: |
            Write-Host 'MyApp post-install validation completed'
            Write-Host "Organization: {{ORGANIZATION_NAME}}"
            Write-Host "Install notes: {{INSTALL_NOTES}}"
            Write-Host "Install mode: {{INSTALL_MODE}}"
            Write-Host "Update channel: {{UPDATE_CHANNEL}}"
            Write-Host "Certificate folder: {{CERT_DIR}}"
            Write-Host "Import certificates: {{IMPORT_CERTS}}"
          shell: powershell
          wait: true
          fail_on_nonzero: true
          timeout_sec: 30

  finalize:
    write_uninstaller: "{{INSTDIR}}/uninstall.exe"

uninstall:
  display_name: "MyApp 2.1.0"
  publisher: "Acme Corporation"

silent:
  install_dir: "{{INSTALL_ROOT}}"
  components:
    - core
    - cli
