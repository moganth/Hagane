# -- MyApp Installer Definition -------------------------------------------------
# Build (Windows):  hagane run installer.yaml --release
# Build (Linux):    hagane run installer.yaml --release
# Silent (Windows): MyApp-setup.exe /S
# Silent (Linux):   ./myapp-setup --silent
# Output formats:   exe (Windows), binary / deb / appimage (Linux)

# ── Build configuration ──────────────────────────────────────────────────────
# Declare target platforms and output formats here.
# The engine reads this block first to decide which runner and toolchain to use.
build:
  os: [windows, linux]
  outputs:
    windows:
      - exe                       # Self-contained PE installer
    linux:
      - binary                    # Raw ELF executable (portable)
      - deb                       # Debian/Ubuntu package (.deb)
      - appimage                  # Universal Linux bundle (.AppImage)

# ── Application metadata ─────────────────────────────────────────────────────
app:
  name: "MyApp"
  version: "2.1.0"
  publisher: "Acme Corporation"
  description: "A fast, modern productivity application."
  website: "https://example.com"
  support_url: "https://example.com/support"
  logo: "assets/logo.png"
  banner: "assets/banner.gif"
  icon: "assets/icon.ico"
  default_install_dir: "{{INSTALL_ROOT}}"   # resolved per platform below
  require_admin: true                        # Windows: UAC elevation; Linux: pkexec/sudo

# ── Variables ─────────────────────────────────────────────────────────────────
# Shared variables are available on both platforms.
# The platform: sub-block defines overrides resolved at runtime based on the
# current OS. Platform-specific variables shadow shared ones with the same key.
variables:
  COMPANY:         "Acme"
  PRODUCT:         "MyApp"
  COMPANY_PRODUCT: "{{COMPANY}}/{{PRODUCT}}"

  # ── Platform-specific path resolution ──
  platform:
    windows:
      INSTALL_ROOT:   "{{PROGRAMFILES64}}/{{COMPANY}}/{{PRODUCT}}"
      APP_EXE:        "{{INSTDIR}}/MyApp.exe"
      CONFIG_DIR:     "{{LOCALAPPDATA}}/{{COMPANY_PRODUCT}}"
      LOG_DIR:        "{{INSTDIR}}/logs"
      UNINSTALL_KEY:  "SOFTWARE/Microsoft/Windows/CurrentVersion/Uninstall/AcmeMyApp"
      APP_REG_KEY:    "SOFTWARE/{{COMPANY_PRODUCT}}"

    linux:
      INSTALL_ROOT:   "/opt/{{COMPANY}}/{{PRODUCT}}"
      APP_EXE:        "{{INSTDIR}}/myapp"
      CONFIG_DIR:     "{{HOME}}/.config/{{COMPANY_PRODUCT}}"
      LOG_DIR:        "{{HOME}}/.local/share/{{COMPANY_PRODUCT}}/logs"
      DESKTOP_DIR:    "{{HOME}}/.local/share/applications"
      UNINSTALL_MANIFEST: "{{INSTDIR}}/.uninstall.json"

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  mode: auto
  path: "{{LOG_DIR}}"
  file_name: "installation.log"
  timestamp: true
  include_raw_os_error: false
  slow_step_warn_sec: 10

# ── Theme ─────────────────────────────────────────────────────────────────────
# Applied to the WebView2 UI (Windows) or wry/WebKitGTK UI (Linux).
# All fields are CSS-compatible — the same UI HTML works on both platforms.
theme:
  accent_color: "#0F6CBD"
  accent_dark_color: "#0B4F9A"
  accent_light_color: "#DCEBFA"
  background_color: "#FFFFFF"
  surface_color: "#F7F9FC"
  text_color: "#1A1A1A"
  text_muted_color: "#667085"
  border_color: "#D0D7E2"
  success_color: "#107C10"
  success_bg_color: "#F3FAF4"
  error_color: "#C42B1C"
  error_bg_color: "#FFF4F2"
  font_family: "'Segoe UI', system-ui, sans-serif"
  border_radius: 6
  window_width: 780
  window_height: 540
  banner_position: top

pages:
  - type: welcome
    title: "Welcome to MyApp Setup"
    subtitle: "Version 2.1.0"

  - type: license
    title: "License Agreement"
    license_file: "docs/LICENSE.txt"

  - type: requirements
    title: "System Requirements Check"

  - type: install_dir
    title: "Choose Installation Folder"

  - type: components
    title: "Select Components"

  - type: custom
    id: deployment_identity
    title: "Deployment Identity"
    subtitle: "Capture organization and operator notes for this installation."
    widgets:
      - type: label
        id: identity_intro
        text: "Values entered on custom pages are stored as installer variables and are available to later install hooks."

      - type: text_input
        id: organization_name
        label: "Organization name"
        bind_to: ORGANIZATION_NAME
        default: "Acme"
        placeholder: "Company or team name"
        help_text: "Used for logs, support notes, and post-install messaging."
        required: true

      - type: multiline_input
        id: install_notes
        label: "Install notes"
        bind_to: INSTALL_NOTES
        default: ""
        placeholder: "Optional notes for this deployment"
        help_text: "Useful for deployment metadata or operator comments."

  - type: custom
    id: deployment_options
    title: "Deployment Options"
    subtitle: "Choose installation behavior and runtime integration options."
    widgets:
      - type: label
        id: options_intro
        text: "These options demonstrate checkbox, radio, dropdown, and folder picker widgets on a second custom page."

      - type: checkbox
        id: import_certs
        label: "Import certificates during setup"
        bind_to: IMPORT_CERTS
        default: true
        help_text: "If enabled, the installer can use the selected certificate folder during post-install tasks."

      - type: radio_group
        id: install_mode
        label: "Install mode"
        bind_to: INSTALL_MODE
        required: true
        default: standard
        help_text: "Choose the overall setup behavior."
        options:
          - label: "Standard"
            value: standard
            description: "Install the normal recommended set of features."
          - label: "Advanced"
            value: advanced
            description: "Enable advanced deployment behavior and extra logging."

      - type: dropdown
        id: update_channel
        label: "Update channel"
        bind_to: UPDATE_CHANNEL
        default: stable
        help_text: "Controls how future update checks should classify this installation."
        options:
          - label: "Stable"
            value: stable
            description: "Recommended for most users."
          - label: "Beta"
            value: beta
            description: "Receives preview releases earlier."
          - label: "Internal"
            value: internal
            description: "For internal deployment and testing only."

      - type: folder_picker
        id: cert_dir
        label: "Certificates folder"
        bind_to: CERT_DIR
        default: "{{INSTDIR}}/certs"
        browse_title: "Select certificate folder"
        help_text: "This path is exposed to install steps as {{CERT_DIR}}."
        required: true
        must_exist: false

  - type: summary
    title: "Ready to Install"

  - type: install
    title: "Installing MyApp"

  - type: finish
    title: "Setup Complete"

requirements:
  # OS version checks — platform: restricts to one OS
  - type: os
    platform: windows
    min_build: 18362                       # Windows 10 1903+
    label: "Windows 10 1903 or newer"

  - type: os
    platform: linux
    distros: [ubuntu, debian, fedora, arch]
    min_version: "20.04"                   # Ubuntu 20.04 / Debian 11 / Fedora 33+
    label: "Ubuntu 20.04+, Debian 11+, or Fedora 33+"

  # Cross-platform hardware checks (no platform: = runs on all)
  - type: ram
    min_mb: 2048
    label: "2 GB RAM minimum"

  - type: disk
    min_mb: 512
    path: "{{INSTDIR}}"
    label: "512 MB free disk space"

  # Windows-only runtime checks
  - type: dotnet
    platform: windows
    min_version: "4.8"
    label: ".NET Framework 4.8"

  # Linux-only package checks (resolved via dpkg/rpm/pacman at runtime)
  - type: package
    platform: linux
    name: "libgtk-3-0"
    label: "GTK3 runtime (required for UI)"

  - type: package
    platform: linux
    name: "libwebkit2gtk-4.1"
    label: "WebKitGTK 4.1 (required for UI)"


components:
  - id: core
    name: "Core Application"
    description: "The main application files. Required."
    size_mb: 120
    required: true
    selected: true

  - id: docs
    name: "Documentation"
    description: "PDF user manual and help files."
    size_mb: 18
    required: false
    selected: true

  - id: samples
    name: "Sample Files"
    description: "Example projects and templates to get you started."
    size_mb: 34
    required: false
    selected: false

  - id: cli
    name: "Command Line Tools"
    description: "myapp.exe CLI - adds to system PATH."
    size_mb: 8
    required: false
    selected: false

install:

  # Shared: run on both platforms
  setup:
    create_dirs:
      - "{{INSTDIR}}"
      - "{{LOG_DIR}}"
      - "{{CONFIG_DIR}}"

  # Shared: component extraction (archive names are identical on both platforms)
  components:
    core:
      archive: "payload.zst"
      target: "{{INSTDIR}}"
    docs:
      archive: "docs.zst"
      target: "{{INSTDIR}}/docs"
    samples:
      archive: "samples.zst"
      target: "{{INSTDIR}}/samples"

  # Platform-specific system integration
  system:

    # ── Windows ──────────────────────────────────────────────────────────────
    windows:
      # Writes to HKLM\SOFTWARE\Acme\MyApp
      register_app:
        key: "{{APP_REG_KEY}}"
        hive: HKLM
        version: "2.1.0"
        install_location: "{{INSTDIR}}"

      # Writes Add/Remove Programs entry
      register_uninstall:
        key: "{{UNINSTALL_KEY}}"
        hive: HKLM
        name: "MyApp 2.1.0"
        version: "2.1.0"
        publisher: "Acme Corporation"
        install_location: "{{INSTDIR}}"
        uninstall: "{{INSTDIR}}/uninstall.exe"
        estimated_size_kb: 180224
        no_modify: true
        no_repair: true

      # .lnk shortcuts
      shortcuts:
        - name: "MyApp"
          target: "{{APP_EXE}}"
          location: desktop
          description: "Launch MyApp"
          icon: "{{APP_EXE}}"
          working_dir: "{{INSTDIR}}"
          component: core

        - name: "MyApp"
          target: "{{APP_EXE}}"
          location: start_menu
          description: "Launch MyApp"
          icon: "{{APP_EXE}}"
          working_dir: "{{INSTDIR}}"
          component: core

        - name: "MyApp User Manual"
          target: "{{INSTDIR}}/docs/UserManual.pdf"
          location: start_menu
          component: docs

      # Appends to system PATH via registry (HKLM)
      path:
        add: "{{INSTDIR}}/bin"
        scope: system             # system = HKLM, user = HKCU

    # ── Linux ────────────────────────────────────────────────────────────────
    linux:
      # Equivalent of register_app: writes an INI config under CONFIG_DIR
      # Windows uses registry; Linux uses config files in ~/.config or /etc
      config:
        path: "{{CONFIG_DIR}}/app.conf"
        format: ini               # ini | json | toml
        entries:
          - key: InstallDir
            value: "{{INSTDIR}}"
          - key: Version
            value: "2.1.0"
          - key: Publisher
            value: "Acme Corporation"
          - key: UpdateChannel
            value: "{{UPDATE_CHANNEL}}"

      # Equivalent of register_uninstall: JSON manifest read by the generated
      # Linux uninstaller binary (no Add/Remove Programs panel on Linux)
      uninstall_manifest:
        path: "{{INSTDIR}}/.uninstall.json"
        entries:
          - key: name
            value: "MyApp 2.1.0"
          - key: version
            value: "2.1.0"
          - key: publisher
            value: "Acme Corporation"
          - key: install_dir
            value: "{{INSTDIR}}"
          - key: config_dir
            value: "{{CONFIG_DIR}}"
          - key: desktop_entry
            value: "{{DESKTOP_DIR}}/myapp.desktop"

      # Equivalent of Windows .lnk shortcuts: XDG .desktop files
      # location: user   → ~/.local/share/applications/myapp.desktop
      # location: system → /usr/share/applications/myapp.desktop (needs root)
      desktop_entry:
        name: "MyApp"
        exec: "{{APP_EXE}} %U"
        icon: "{{INSTDIR}}/assets/icon.png"
        comment: "A fast, modern productivity application"
        categories: "Office;Utility;"
        terminal: false
        location: user
        component: core

      # Equivalent of Windows PATH registry write
      # scope: user   → appends to ~/.bashrc and ~/.profile
      # scope: system → writes /etc/profile.d/myapp.sh (needs root)
      path:
        add: "{{INSTDIR}}/bin"
        scope: user

  # Post-install hooks — platform: restricts to one OS
  hooks:
    post_install:
      - run:
          platform: windows
          command: |
            Write-Host 'MyApp post-install validation completed'
            Write-Host "Organization: {{ORGANIZATION_NAME}}"
            Write-Host "Install notes: {{INSTALL_NOTES}}"
            Write-Host "Install mode: {{INSTALL_MODE}}"
            Write-Host "Update channel: {{UPDATE_CHANNEL}}"
            Write-Host "Certificate folder: {{CERT_DIR}}"
            Write-Host "Import certificates: {{IMPORT_CERTS}}"
          shell: powershell
          wait: true
          fail_on_nonzero: true
          timeout_sec: 30

      - run:
          platform: linux
          command: |
            echo "MyApp post-install validation completed"
            echo "Organization: {{ORGANIZATION_NAME}}"
            echo "Install mode: {{INSTALL_MODE}}"
            echo "Update channel: {{UPDATE_CHANNEL}}"
            chmod +x "{{APP_EXE}}"
            update-desktop-database "{{DESKTOP_DIR}}" 2>/dev/null || true
          shell: bash
          wait: true
          fail_on_nonzero: true
          timeout_sec: 30

  # Write the uninstaller binary for each platform
  finalize:
    windows:
      write_uninstaller: "{{INSTDIR}}/uninstall.exe"
    linux:
      write_uninstaller: "{{INSTDIR}}/uninstall"     # ELF binary

# ── Uninstall metadata ────────────────────────────────────────────────────────
uninstall:
  display_name: "MyApp 2.1.0"
  publisher: "Acme Corporation"

# ── Silent install ────────────────────────────────────────────────────────────
# All three flags are accepted on either platform:
#   Windows: MyApp-setup.exe /S
#   Linux:   ./myapp-setup --silent   or   ./myapp-setup -s
silent:
  flags: ["/S", "--silent", "-s"]
  install_dir: "{{INSTALL_ROOT}}"
  components:
    - core
    - cli
