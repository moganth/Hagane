# yaml-language-server: $schema=../sdk/schema/installer.schema.json

build:
  os: [windows, linux]
  outputs:
    windows: [exe]
    linux: [tarball]

app:
  name: "Hagane"
  version: "0.1.5"
  publisher: "Installer Engine"
  description: "Command-line installer builder for the Installer Engine workspace."
  default_install_dir: "{{INSTALL_ROOT}}"
  registry_key: "InstallerEngine\\Hagane"
  require_admin: true

variables:
  LOG_DIR: "{{INSTDIR}}/logs"
  platform:
    windows:
      INSTALL_ROOT: "{{PROGRAMFILES64}}/Hagane"
      HAGANE_EXE: "{{INSTDIR}}/bin/hagane.exe"
      UNINSTALL_KEY: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Hagane"
      APP_REG_KEY: "SOFTWARE\\InstallerEngine\\Hagane"
    linux:
      INSTALL_ROOT: "/usr/local/hagane"
      HAGANE_EXE: "{{INSTDIR}}/bin/hagane"

logging:
  mode: auto
  path: "{{LOG_DIR}}"
  file_name: "installation.log"
  timestamp: true
  include_raw_os_error: false
  slow_step_warn_sec: 10

pages:
  - type: welcome
    title: "Welcome to Hagane Setup"
    subtitle: "Install the Hagane command-line tool"

  - type: install_dir
    title: "Choose Installation Folder"

  - type: components
    title: "Choose PATH Scope"

  - type: summary
    title: "Ready to Install"

  - type: install
    title: "Installing Hagane"

  - type: finish
    title: "Setup Complete"

components:
  - id: user_path
    name: "Add to user PATH"
    description: |
      Windows: adds hagane to your user PATH.
      Linux: appends to ~/.bashrc and ~/.profile.
    required: false
    selected: true

  - id: system_path
    name: "Add to system PATH"
    description: |
      Windows: adds hagane to the system PATH for all users.
      Linux: writes /etc/profile.d/hagane-path.sh (requires sudo).
    required: false
    selected: false

install:
  setup:
    create_dirs:
      - "{{INSTDIR}}"
      - "{{INSTDIR}}/bin"

  components:
    user_path:
      archive: "payload.zst"
      target: "{{INSTDIR}}"
    system_path:
      archive: "payload.zst"
      target: "{{INSTDIR}}"

  system:
    windows:
      register_app:
        key: "{{APP_REG_KEY}}"
        hive: HKLM
        version: "0.1.5"
        install_location: "{{INSTDIR}}"

      register_uninstall:
        key: "{{UNINSTALL_KEY}}"
        hive: HKLM
        name: "Hagane"
        version: "0.1.5"
        publisher: "Installer Engine"
        install_location: "{{INSTDIR}}"
        uninstall: "{{INSTDIR}}/uninstall.exe"
        no_modify: true
        no_repair: true

      path:
        add: "{{INSTDIR}}/bin"
        scope: system
        component: system_path

    linux:
      uninstall_manifest:
        path: "{{INSTDIR}}/uninstall.json"
        entries:
          - key: name
            value: "Hagane"
          - key: version
            value: "0.1.5"
          - key: install_dir
            value: "{{INSTDIR}}"
          - key: binary
            value: "{{HAGANE_EXE}}"

      path:
        - add: "{{INSTDIR}}/bin"
          scope: user
          component: user_path
        - add: "{{INSTDIR}}/bin"
          scope: system
          component: system_path

  finalize:
    windows:
      write_uninstaller: "{{INSTDIR}}/uninstall.exe"
    linux:
      write_uninstaller: "{{INSTDIR}}/uninstall.sh"

  hooks:
    post_install:
      - run:
          platform: linux
          command: |
            chmod +x "{{HAGANE_EXE}}"
            ln -sf "{{HAGANE_EXE}}" /usr/local/bin/hagane
          shell: bash
          wait: true
          fail_on_nonzero: false
          timeout_sec: 10

silent:
  flags: ["/S", "--silent", "-s"]
  install_dir: "{{INSTALL_ROOT}}"
